name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend — install, lint, typecheck, build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npx tsc --noEmit
          npm run build

      - name: Go — vet, test, build binary
        run: |
          go vet ./...
          go test -race ./...
          CGO_ENABLED=0 go build -o bin/crondeck ./cmd/crondeck

      - name: Docker — build image (no push)
        run: docker build -t crondeck:ci .
